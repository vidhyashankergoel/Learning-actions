name: ci-cd pipeline #workflow name  display this name under the Actions tab in GitHub

# trigger based on event A trigger is the condition that starts a workflow.
on:
  #push: # when someone push the code to main branch ; use whenever code is updated
   # branches:
    #  - dev
      # NOTE: '*' does not cross a slash. Matches feature-login, NOT
      # feature/login. Use 'feature/*' if that is your naming convention.
     # - 'feature-*'
     # - main

 # pull_request:
  #  branches:
   #   - main
    # NOTE: a PR from dev into main fires this AND the push trigger above,
    # so every PR costs two full runs. Drop dev from push if unwanted.

  workflow_dispatch: # allows you to manually trigger the workflow from the Actions tab in GitHub ; when you need to manually trigger workflow

permissions: # to give permission to the workflow to access the repository contents and id-token ; you can set permissions at the workflow level or job level ; if you set permissions at the workflow level then it will apply to all jobs in the workflow ; if you set permissions at the job level then it will apply to that specific job only
  contents: read # read permission for contents of the repository ; allows workflow to read the contents of the repository
  # id-token: write removed. No job here exchanges an OIDC token with a cloud
  # provider. Granting it workflow-wide lets every job, and every third-party
  # action inside them, mint an identity token. Add it back at JOB level on
  # the specific job that assumes an AWS/Azure/GCP role.

concurrency:
  # concurrency group name ; one queue per branch, because github.ref is in the key.
  # Runs on different branches never block or cancel each other.
  group: ci-cd-pipeline-${{ github.ref }}
  # Cancel superseded runs on feature branches only. On main this is false:
  # cancelling this pipeline mid-deploy leaves the environment half-updated,
  # which costs far more than the wasted minutes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_ENV: staging
  # Quoted. Unquoted 2.1 is a YAML float, so 2.10 would silently become 2.1.
  APP_VERSION: '2.1'
  # API_KEY removed from workflow scope. It was visible to all four jobs
  # including the two that never use it. Declare it as job-level or step-level
  # env on the single step that needs it.

jobs: # set of steps that execute as part of the workflow; each job runs in a fresh instance of the virtual environment ;  jobs run in parallel by default ; you can configure jobs to run sequentially by using the needs keyword

  job1:
    name: job1
    runs-on: ubuntu-latest
    # Account default is 360 minutes. A hung step otherwise burns six hours.
    timeout-minutes: 10
    steps:

    - name: step-1
      run: |
         pwd
         ls -ltr
         hostname

    - name: step-2 checkout code
      # Owner was 'action', which does not exist. It is 'actions'.
      uses: actions/checkout@v5.0.0

    - name: step3
      # 'run' was one space deeper than 'name'. That is a YAML parse error and
      # it killed the entire file, not just this step.
      run: |
          # Backticks removed: command substitution inside echo collapses all
          # newlines onto one line, so a directory listing arrives unreadable.
          pwd > myartifact.txt
          mkdir -p artifacts
          ls -ltr > artifacts/list.txt
          hostname > artifacts/hostname.txt

    - name: step4 - upload single file
      uses: actions/upload-artifact@v5.0.0
      with:
        name: single_file
        path: ./myartifact.txt
        # Fail here rather than produce an empty artifact that fails a job
        # later at download time with a confusing message.
        if-no-files-found: error

    - name: step5 - upload artifacts directory
      # Added: artifacts/ was written then discarded with the runner. Delete
      # this step and the mkdir above if that was intended.
      uses: actions/upload-artifact@v5.0.0
      with:
        name: artifacts_dir
        path: ./artifacts/
        if-no-files-found: error


  job2:
    # Was 'name: job3', which does not match the job key and makes the run
    # graph and any required-status-check rule confusing.
    name: job2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: show github context
      run: |
        echo "Repository: ${{github.repository}} "
        echo " Trigger by: ${{github.actor}}"
        echo " Branch : ${{github.ref}}"

    - name: referring repo seceret
      env:
        # Secrets go through env, not into the command text. ${{ }} inside a
        # run block is substituted BEFORE the shell sees it, putting the raw
        # value in the process arguments where anything on the box can read it.
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: |
        # Assert presence, never print the value. GitHub's *** masking is
        # best-effort and fails on multi-line and encoded secrets.
        if [ -z "${APP_PASSWORD}" ]; then
          echo "[ERROR] APP_PASSWORD is not set. Check repository secrets."
          exit 1
        fi
        echo "[INFO] APP_PASSWORD is present (${#APP_PASSWORD} characters)"

    - name: Print Environment Info
      run: echo " Deploying $APP_ENV version $APP_VERSION"


  staging:
    environment:
      name: STAGING
    # 'or' is not valid here. GitHub Actions expressions use || and &&.
    # The literal word 'or' fails workflow validation outright.
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    name: stage-deployment
    # Gate on CI passing. Without needs, this deployed in parallel with the
    # build job and would ship even if job1 failed.
    needs: [job1, job2]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: referring env variables
        run: echo "[INFO] Running deployment on ${{vars.HOST}} using ${{vars.USER}}."

      - name: referring env secrets
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          if [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "[ERROR] PASSWORD not set for the STAGING environment."
            exit 1
          fi
          echo "[INFO] credentials for ${{vars.USER}} resolved from STAGING."


  Prod:
    environment:
      name: PRODUCTION
    name: prod-deployment
    # THE important fix. Without this, prod ran in parallel with staging and
    # could complete first. Production must never deploy an artifact that has
    # not survived staging.
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: referring env variables
        run: echo "[INFO] Running deployment on ${{vars.HOST}} using ${{vars.USER}}."

      - name: referring env secrets
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          if [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "[ERROR] PASSWORD not set for the PRODUCTION environment."
            exit 1
          fi
          echo "[INFO] credentials for ${{vars.USER}} resolved from PRODUCTION."
