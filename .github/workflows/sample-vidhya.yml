name: ci-cd-pipeline #workflow name  display this name under the Actions tab in GitHub

# trigger based on event A trigger is the condition that starts a workflow.
on:
  push: # when someone push the code to main branch ; use whenever code is updated
    branches:
      - dev
      # NOTE: '*' does not cross a slash. This matches feature-login but NOT
      # feature/login. Change to 'feature/*' if that is your convention.
      - 'feature-*'
      - main

  pull_request:
    branches:
      - main
    # NOTE: a PR from dev to main fires BOTH this and the push trigger above,
    # so every PR costs two full runs. Drop dev/feature-* from push if that
    # is not what you want.

  workflow_dispatch: # allows you to manually trigger the workflow from the Actions tab in GitHub ; when you need to manually trigger workflow

permissions: # to give permission to the workflow to access the repository contents and id-token ; you can set permissions at the workflow level or job level ; if you set permissions at the workflow level then it will apply to all jobs in the workflow ; if you set permissions at the job level then it will apply to that specific job only
  contents: read # read permission for contents of the repository ; allows workflow to read the contents of the repository
  # id-token: write was removed. No job here performs OIDC exchange with a
  # cloud provider, and granting it workflow-wide means every job (and every
  # third-party action inside them) can mint an identity token. Add it back
  # at JOB level on the specific job that assumes an AWS/Azure/GCP role.

concurrency:
  # concurrency group name ; one queue per branch, because github.ref is in the key.
  # Runs on different branches never block or cancel each other.
  group: ci-cd-pipeline-${{ github.ref }}
  # Cancel superseded runs on feature branches only. On main this is false:
  # cancelling a pipeline named ci-cd halfway through a deploy leaves the
  # target in an unknown state, which is worse than wasting a few minutes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_ENV: staging
  # Quoted. Unquoted 2.1 is a YAML float, so the day this becomes 2.10 it
  # silently collapses back to 2.1 and your version string is wrong.
  APP_VERSION: '2.1'
  # API_KEY was removed from here. Workflow-level env is the widest possible
  # scope: it hands a production credential to every job, including ones that
  # never touch it. Declare it as job-level or step-level env on the single
  # step that needs it instead.

jobs: # set of steps that execute as part of the workflow; each job runs in a fresh instance of the virtual environment ;  jobs run in parallel by default ; you can configure jobs to run sequentially by using the needs keyword

  job1:
    name: job1
    runs-on: ubuntu-latest
    # Account default is 360 minutes. A step hung on stdin sits there for six
    # hours before anything kills it.
    timeout-minutes: 10
    steps:

    - name: step-1
      run: |
         pwd
         ls -ltr
         hostname

    - name: step-2 checkout code
      # Owner was 'action', which does not exist. It is 'actions' (plural).
      uses: actions/checkout@v5.0.0

    - name: step3
      # 'run' was indented one space deeper than 'name', which is a YAML parse
      # error and killed the entire file, not just this step.
      run: |
          # Backticks removed. `ls -ltr` inside echo collapses every newline
          # into one line, so the listing arrives unreadable. Redirect direct.
          pwd > myartifact.txt
          mkdir -p artifacts
          ls -ltr > artifacts/list.txt
          hostname > artifacts/hostname.txt

    - name: step4 - upload single file
      uses: actions/upload-artifact@v5.0.0
      with:
        name: single_file
        path: ./myartifact.txt
        # Fail loudly if the glob matches nothing. Default is a warning, which
        # turns into a confusing download failure one job later.
        if-no-files-found: error

    - name: step5 - upload artifacts directory
      # Added: artifacts/ was being created and populated, then discarded with
      # the runner. Remove this step (and the mkdir above) if that was intended.
      uses: actions/upload-artifact@v5.0.0
      with:
        name: artifacts_dir
        path: ./artifacts/
        if-no-files-found: error


  job2:
    name: job2
    needs: job1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: step1- checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        # Owner corrected. v5 download pairs fine with v5 upload (both use the
        # v4+ artifact backend). Latest download major is v6 if you want it.
        uses: actions/download-artifact@v5.0.0
        with:
          name: single_file
      - name: checking current directory post download of single file
        run: |
          pwd
          ls -ltr


  job3:
    name: job3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: show github context
      run: |
        echo "Repository: ${{github.repository}} "
        echo " Trigger by: ${{github.actor}}"
        echo " Branch : ${{github.ref}}"

    - name: referring repo seceret
      env:
        # Secrets belong in env, not interpolated into the command line. In a
        # run: block, ${{ secrets.X }} is substituted into the script BEFORE
        # the shell sees it, so the raw value lands in the process arguments.
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: |
        # Never echo a secret. GitHub masks known values to ***, but masking
        # breaks on multi-line secrets and on anything encoded or transformed
        # before printing. Assert presence instead of printing content.
        if [ -z "${APP_PASSWORD}" ]; then
          echo "[ERROR] APP_PASSWORD is not set. Check repo secrets."
          exit 1
        fi
        echo "[INFO] APP_PASSWORD is present (${#APP_PASSWORD} characters)"

    - name: Print Environment Info
      run: echo " Deploying $APP_ENV version $APP_VERSION"
